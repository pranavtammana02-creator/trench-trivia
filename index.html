<title>Trench Trivia</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dive console. Prompt panel on the left, three descending depth gauges on the right; the water darkens as you sink. Single deep-sea look. */
:root {
  --ink: #e8f6f8;
  --dim: #8db4c0;
  --faint: rgba(141, 180, 192, 0.22);
  --panel: rgba(4, 20, 32, 0.72);
  --sonar: #4ff0d0;
  --p1: #ff7b6b;
  --p2: #6fb8ff;
  --p3: #ffd166;
  --t0: #a8ecf7; --t1: #5fd3e6; --t2: #4a8dd8; --t3: #7d6bf0; --t4: #c35cf0; --t5: #ff4fa3;
  --display: "Unbounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { margin: 0; }
*, *::before, *::after { box-sizing: border-box; }
body { background: #0b4560; color: var(--ink); font: 15px/1.5 var(--body); transition: background 1.2s ease; }
@media (prefers-reduced-motion: reduce) { body { transition: none; } * { animation: none !important; } }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; display: grid; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 800 20px var(--display); letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--sonar); box-shadow: 0 0 0 0 var(--sonar); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(79,240,208,0.6); } 80%, 100% { box-shadow: 0 0 0 14px rgba(79,240,208,0); } }
.meta { font: 600 12px var(--mono); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; display: flex; gap: 14px; flex-wrap: wrap; }
.meta b { color: var(--ink); }
.console { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .console { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--faint); border-radius: 14px; padding: 22px; display: grid; gap: 16px; min-width: 0; backdrop-filter: blur(6px); }
h1 { font: 800 clamp(34px, 7vw, 64px)/0.95 var(--display); margin: 0; letter-spacing: -0.03em; text-wrap: balance; }
h2 { font: 800 clamp(22px, 3.6vw, 34px)/1.15 var(--display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h3 { font: 600 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin: 0; }
p { margin: 0; max-width: 62ch; }
.lede { color: var(--dim); font-size: 16px; }
.lede b { color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
button { font: 600 15px var(--body); border: 0; border-radius: 999px; padding: 11px 22px; cursor: pointer; background: var(--sonar); color: #022a24; }
button:hover:not(:disabled) { filter: brightness(1.08); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--faint); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sonar); outline-offset: 2px; }
input { font: 600 17px var(--body); color: var(--ink); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--faint); border-radius: 10px; padding: 11px 14px; min-width: 0; }
input.code { font: 600 20px var(--mono); letter-spacing: 0.3em; text-transform: uppercase; width: 8.5em; }
.field { display: grid; gap: 6px; }
.field label { font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.note { font-size: 13px; color: var(--dim); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.mode { border: 1px solid var(--faint); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.ladder { display: grid; gap: 4px; }
.rung { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; font-size: 13px; }
.rung i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.rung span:nth-child(3) { font-family: var(--mono); color: var(--dim); }
.rung span:nth-child(4) { font-family: var(--mono); color: var(--ink); min-width: 4.5em; text-align: right; }
.bigcode { font: 800 clamp(40px, 9vw, 72px) var(--mono); letter-spacing: 0.18em; color: var(--sonar); }
.seats { display: grid; gap: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--faint); border-left: 4px solid var(--c); border-radius: 10px; min-width: 0; }
.seat .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.seat .st { font: 600 12px var(--mono); color: var(--dim); }
.seat.empty { border-style: dashed; border-left-style: solid; color: var(--dim); }
.prompt { font: 800 clamp(24px, 4.4vw, 40px)/1.12 var(--display); letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
.answerbar { display: flex; gap: 10px; flex-wrap: wrap; }
.answerbar input { flex: 1 1 220px; }
.timer { display: flex; align-items: center; gap: 12px; }
.timer .track { flex: 1; height: 6px; border-radius: 3px; background: var(--faint); overflow: hidden; }
.timer .track b { display: block; height: 100%; background: var(--sonar); transition: width 0.25s linear; }
.timer .secs { font: 600 18px var(--mono); min-width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; }
.timer.low .track b { background: #ff6b6b; } .timer.low .secs { color: #ff8b8b; }
.feedback { min-height: 1.5em; font-weight: 600; }
.feedback.bad { color: #ff9b8b; }
.feedback.good { color: var(--sonar); }
.locked { display: grid; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--c, var(--faint)); background: rgba(0,0,0,0.2); }
.locked .ans { font: 800 22px var(--display); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); white-space: nowrap; }
.results { display: grid; gap: 10px; }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--faint); border-left: 4px solid var(--c); }
.res .who { font: 600 12px var(--mono); color: var(--c); letter-spacing: 0.06em; text-transform: uppercase; }
.res .what { font: 800 19px var(--display); overflow-wrap: anywhere; }
.res .what.none { color: var(--dim); font-weight: 500; font-family: var(--body); font-size: 15px; }
.res .pts { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; font: 600 22px var(--mono); }
.res .pts small { display: block; font-size: 11px; color: var(--dim); }
.deeper { display: flex; flex-wrap: wrap; gap: 6px; }
.podium { display: grid; gap: 10px; }
.gauges { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.gwrap { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; height: 420px; }
@media (max-width: 820px) { .gauges { position: static; } .gwrap { height: 260px; } }
.scale { position: relative; font: 500 10px var(--mono); color: var(--dim); }
.scale span { position: absolute; right: 0; transform: translateY(-50%); }
.col { position: relative; border-radius: 8px; background: linear-gradient(180deg, rgba(168,236,247,0.10), rgba(0,0,0,0.25)); border: 1px solid var(--faint); overflow: hidden; }
.col .zone { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--faint); }
.col .line { position: absolute; left: 50%; top: 0; width: 2px; margin-left: -1px; background: var(--c); opacity: 0.55; transition: height 1s cubic-bezier(.2,.8,.2,1); }
.col .diver { position: absolute; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); transition: top 1s cubic-bezier(.2,.8,.2,1); }
.gnames { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.gnames div { text-align: center; min-width: 0; }
.gnames .n { font: 600 12px var(--body); color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gnames .d { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.gnames .s { font: 500 10px var(--mono); color: var(--dim); }
.tag { font: 600 11px var(--mono); color: var(--dim); }
</style>
</head>

// Peer-to-peer stand-in for the artifact `room` API, so the standalone build needs no accounts.
// The host's browser is the hub: players connect to it over WebRTC (PeerJS) and it relays everyone's presence.
const PeerRoom = (() => {
  const PREFIX = 'trench-trivia-v1-';
  function join(name, asHost) {
    return new Promise((resolve, reject) => {
      const hostId = PREFIX + name;
      const peer = asHost ? new Peer(hostId) : new Peer();
      const list = new Map();         // peer id -> presence
      const handlers = [];
      const conns = new Map();
      let myId = null, hostConn = null, settled = false, mine = {};
      const snapshot = () => [...list].map(([id, presence]) => ({ peer: id, presence, sameTab: id === myId, isMe: id === myId }));
      const fire = () => { const ch = { peers: snapshot() }; handlers.forEach(h => { try { h(ch); } catch (e) { console.error(e); } }); };
      const broadcast = () => {
        const msg = { type: 'peers', list: [...list] };
        for (const c of conns.values()) if (c.open) c.send(msg);
        fire();
      };
      const api = {
        name,
        presence(patch) {
          for (const k in patch) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
          mine = JSON.parse(JSON.stringify(mine));
          if (asHost) { list.set(myId, mine); broadcast(); }
          else if (hostConn && hostConn.open) { hostConn.send({ type: 'presence', p: mine }); list.set(myId, mine); fire(); }
          return Promise.resolve();
        },
        peers: snapshot,
        onPeers(fn) { handlers.push(fn); setTimeout(() => fn({ peers: snapshot() }), 0); return () => { const i = handlers.indexOf(fn); if (i >= 0) handlers.splice(i, 1); }; },
        leave() { try { peer.destroy(); } catch (_) {} return Promise.resolve(); },
      };
      const fail = msg => { if (!settled) { settled = true; try { peer.destroy(); } catch (_) {} reject(new Error(msg)); } };
      setTimeout(() => fail('timeout'), 12000);
      peer.on('error', err => {
        if (!settled) fail(err.type === 'peer-unavailable' ? 'No game with that code.' : err.type === 'unavailable-id' ? 'Code taken, try again.' : 'Could not connect.');
        else if (!asHost && (err.type === 'peer-unavailable' || err.type === 'network')) { list.clear(); fire(); }
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch (_) {} });
      peer.on('open', id => {
        myId = id;
        if (asHost) {
          list.set(myId, mine);
          peer.on('connection', c => {
            c.on('open', () => { conns.set(c.peer, c); c.send({ type: 'peers', list: [...list] }); });
            c.on('data', d => { if (d && d.type === 'presence' && d.p && typeof d.p === 'object') { list.set(c.peer, d.p); broadcast(); } });
            const drop = () => { conns.delete(c.peer); if (list.delete(c.peer)) broadcast(); };
            c.on('close', drop); c.on('error', drop);
          });
          settled = true; resolve(api);
        } else {
          hostConn = peer.connect(hostId, { reliable: true });
          hostConn.on('open', () => { settled = true; hostConn.send({ type: 'presence', p: mine }); resolve(api); });
          hostConn.on('data', d => {
            if (d && d.type === 'peers' && Array.isArray(d.list)) {
              list.clear();
              for (const [id, p] of d.list) list.set(id, id === myId ? mine : p);
              list.set(myId, mine);
              fire();
            }
          });
          hostConn.on('close', () => { list.clear(); fire(); });
        }
      });
    });
  }
  return { join };
})();

<script>
(() => {
const TIERS = [
  { n: 'Surface', pts: 10 }, { n: 'Sunlight', pts: 20 }, { n: 'Twilight', pts: 40 },
  { n: 'Midnight', pts: 60 }, { n: 'Abyss', pts: 85 }, { n: 'Hadal', pts: 100 },
];
const ROUNDS = 7, SECS = 25, M_PER_PT = 4, MAX_DEPTH = ROUNDS * 100 * M_PER_PT;
const COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)'];
const $main = document.getElementById('main'), $gauges = document.getElementById('gauges'), $meta = document.getElementById('meta');

/* ---------- answer matching ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/\+\+/g, ' plus plus ').replace(/#/g, ' sharp ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/&/g, ' and ')
    .replace(/['\u2019`.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim().replace(/^(the|a|an) /, '');
}
const INDEX = BANK.map(q => {
  const map = new Map();
  const add = (group, tier) => group.split(',').forEach(entry => {
    const alts = entry.split('/').map(s => s.trim()).filter(Boolean);
    if (!alts.length) return;
    const key = norm(alts[0]);
    for (const a of alts) {
      const k = norm(a);
      if (k && !map.has(k)) map.set(k, { tier, disp: alts[0], key });
    }
  });
  add(q.h, 5);
  q.t.forEach((g, i) => add(g, i));
  return map;
});
function lev(a, b, cap) {
  if (Math.abs(a.length - b.length) > cap) return cap + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > cap) return cap + 1;
    prev = cur;
  }
  return prev[b.length];
}
function judge(qid, text) {
  const map = INDEX[qid], k = norm(text);
  if (!k) return null;
  for (const c of [k, k.replace(/es$/, ''), k.replace(/s$/, ''), k + 's']) if (map.has(c)) return map.get(c);
  if (k.length < 5) return null;
  const cap = k.length >= 9 ? 2 : 1;
  let best = null, bd = cap + 1;
  for (const [key, v] of map) { const d = lev(k, key, cap); if (d < bd) { bd = d; best = v; if (!d) break; } }
  return best;
}

/* ---------- shared game model ---------- */
function newGame() {
  const ids = BANK.map((_, i) => i);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  return { phase: 'lobby', seats: [], order: ids.slice(0, ROUNDS), qi: 0, left: SECS, ans: {}, tot: [0, 0, 0], last: [] };
}
function settle(g) {
  const counts = {};
  for (const s of g.seats) { const a = g.ans[s.id]; if (a) counts[a.k] = (counts[a.k] || 0) + 1; }
  g.last = g.seats.map((s, i) => {
    const a = g.ans[s.id];
    if (!a) return 0;
    const shared = counts[a.k] > 1;
    const pts = shared ? Math.round(TIERS[a.r].pts / 2) : TIERS[a.r].pts;
    a.p = pts; a.sh = shared ? 1 : 0;
    g.tot[i] += pts;
    return pts;
  });
  g.phase = 'reveal';
}
function nextQuestion(g) {
  if (g.qi >= ROUNDS - 1) { g.phase = 'final'; return; }
  g.qi++; g.ans = {}; g.left = SECS; g.phase = 'q';
}
const depth = pts => pts * M_PER_PT;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cleanName = s => String(s || '').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f]/g, '').trim().slice(0, 14);

/* ---------- app state ---------- */
let mode = 'home';        // home | host | client | local
let G = null;             // the game state being shown
let room = null, R = null, roomReady = 'wait';
let code = '', myName = '', myPeer = null, hostSeen = false, hostGone = false;
let tick = null, deadline = 0;
let local = { turn: 0, step: 'pass' }; // pass-and-play sub-state
let lastScreen = '', myLocked = null, feedback = { text: '', cls: '' };
try { myName = localStorage.getItem('tt-name') || ''; } catch (_) {}

(async () => {
  room = window.Peer ? PeerRoom : null;
  roomReady = room ? 'yes' : 'no';
  if (mode === 'home') draw(true);
})();
setTimeout(() => { if (roomReady === 'wait') { roomReady = 'no'; if (mode === 'home') draw(true); } }, 11000);

function mySeatIndex() {
  if (!G) return -1;
  if (mode === 'host') return 0;
  if (mode === 'client') return G.seats.findIndex(s => s.id === myPeer);
  if (mode === 'local' && G.phase === 'q') return local.turn;
  return -1;
}

/* ---------- online: host ---------- */
async function hostGame() {
  myName = cleanName(document.getElementById('nm').value) || 'Host';
  saveName();
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ';
  code = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
  try { R = await room.join(code.toLowerCase(), true); }
  catch (e) { return toast(e.message === 'Code taken, try again.' ? 'That code was taken. Click Host again.' : 'Could not open a game. Check your internet connection and try again.'); }
  mode = 'host';
  G = newGame();
  G.seats = [{ id: 'host', name: myName }];
  R.onPeers(() => hostSync());
  pushState();
  draw(true);
}
function hostSync() {
  if (mode !== 'host' || !G) return;
  const peers = R.peers().filter(p => !p.sameTab && p.presence && p.presence.role === 'player' && p.presence.code === code);
  let changed = false;
  if (G.phase === 'lobby') {
    const before = JSON.stringify(G.seats);
    G.seats = G.seats.filter(s => s.id === 'host' || peers.some(p => p.peer === s.id));
    for (const p of peers) {
      const nm = cleanName(p.presence.name) || 'Diver';
      const seat = G.seats.find(s => s.id === p.peer);
      if (seat) seat.name = nm;
      else if (G.seats.length < 3) G.seats.push({ id: p.peer, name: nm });
    }
    changed = JSON.stringify(G.seats) !== before;
  }
  if (G.phase === 'q') {
    for (const s of G.seats) {
      if (s.id === 'host' || G.ans[s.id]) continue;
      const p = peers.find(x => x.peer === s.id);
      const sub = p && p.presence.sub;
      if (sub && sub.qi === G.qi && typeof sub.text === 'string') {
        const j = judge(G.order[G.qi], sub.text.slice(0, 80));
        if (j) { G.ans[s.id] = { t: j.disp, k: j.key, r: j.tier }; changed = true; }
      }
    }
    if (G.seats.every(s => G.ans[s.id] || (s.id !== 'host' && !peers.some(p => p.peer === s.id)))) { endQuestion(); return; }
  }
  if (changed) { pushState(); draw(); }
}
function pushState() { if (R && mode === 'host') R.presence({ role: 'host', code, g: G }).catch(() => {}); }
function startClock() {
  clearInterval(tick);
  deadline = Date.now() + SECS * 1000;
  tick = setInterval(() => {
    if (!G || G.phase !== 'q') return;
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (left !== G.left) {
      G.left = left;
      if (mode === 'host') pushState();
      draw();
    }
    if (left <= 0) { if (mode === 'host') endQuestion(); else if (mode === 'local') localTimeout(); }
  }, 200);
}
function hostStart() {
  if (G.seats.length < 2) return;
  G.phase = 'q'; G.qi = 0; G.ans = {}; G.left = SECS; G.tot = [0, 0, 0];
  myLocked = null; feedback = { text: '', cls: '' };
  startClock(); pushState(); draw(true);
}
function endQuestion() {
  clearInterval(tick);
  if (G.phase !== 'q') return;
  settle(G); pushState(); draw(true);
}
function hostNext() {
  nextQuestion(G);
  myLocked = null; feedback = { text: '', cls: '' };
  if (G.phase === 'q') startClock();
  pushState(); draw(true);
}
function hostAgain() {
  const seats = G.seats;
  G = newGame(); G.seats = seats;
  pushState(); draw(true);
}

/* ---------- online: player ---------- */
async function joinGame() {
  const c = document.getElementById('jc').value.trim().toUpperCase().replace(/[^A-Z]/g, '');
  myName = cleanName(document.getElementById('nm').value) || 'Diver';
  saveName();
  if (c.length !== 4) return toast('Game codes are 4 letters.');
  toast('Connecting…');
  try { R = await room.join(c.toLowerCase(), false); }
  catch (e) { return toast(e.message === 'No game with that code.' ? 'No game with code ' + c + '. Check it with your host.' : 'Could not connect to that game. Try again, or try another network.'); }
  code = c; mode = 'client'; G = null; hostSeen = false; hostGone = false;
  R.presence({ role: 'player', code, name: myName, sub: null }).catch(() => {});
  R.onPeers(ch => {
    const me = ch.peers.find(p => p.sameTab); if (me) myPeer = me.peer;
    const host = ch.peers.find(p => !p.sameTab && p.presence && p.presence.role === 'host' && p.presence.code === code);
    if (host && host.presence.g) {
      const prev = G; G = host.presence.g; hostSeen = true; hostGone = false;
      if (prev && (prev.qi !== G.qi || prev.phase !== G.phase) && G.phase === 'q') { myLocked = null; feedback = { text: '', cls: '' }; R.presence({ sub: null }).catch(() => {}); }
      draw();
    } else if (hostSeen) { hostGone = true; draw(true); }
  });
  setTimeout(() => { if (mode === 'client' && !hostSeen) { hostGone = true; draw(true); } }, 8000);
  draw(true);
}

/* ---------- pass and play ---------- */
function startLocal() {
  const names = [0, 1, 2].map(i => cleanName(document.getElementById('ln' + i).value) || ['Diver 1', 'Diver 2', 'Diver 3'][i]);
  mode = 'local';
  G = newGame();
  G.seats = names.map((n, i) => ({ id: 'p' + i, name: n }));
  G.phase = 'q'; local = { turn: 0, step: 'pass' };
  draw(true);
}
function localBegin() { local.step = 'answer'; G.left = SECS; myLocked = null; feedback = { text: '', cls: '' }; startClock(); draw(true); }
function localAdvance() {
  clearInterval(tick);
  if (local.turn < G.seats.length - 1) { local.turn++; local.step = 'pass'; draw(true); }
  else { settle(G); draw(true); }
}
function localTimeout() { localAdvance(); }
function localNext() {
  nextQuestion(G);
  local = { turn: 0, step: 'pass' };
  draw(true);
}

/* ---------- answering ---------- */
function submit() {
  const inp = document.getElementById('ans');
  if (!inp || !G || G.phase !== 'q') return;
  const text = inp.value.trim();
  if (!text) return;
  const j = judge(G.order[G.qi], text);
  if (!j) {
    feedback = { text: `“${text.slice(0, 40)}” isn't on the chart. Try another.`, cls: 'bad' };
    inp.select(); setFeedback();
    return;
  }
  myLocked = { t: j.disp, k: j.key, r: j.tier };
  if (mode === 'host') { G.ans.host = myLocked; hostSync(); pushState(); }
  else if (mode === 'client') { R.presence({ sub: { qi: G.qi, text } }).catch(() => {}); }
  else if (mode === 'local') { clearInterval(tick); G.ans[G.seats[local.turn].id] = myLocked; draw(true); setTimeout(localAdvance, 900); return; }
  draw(true);
}
function setFeedback() { const f = document.getElementById('fb'); if (f) { f.textContent = feedback.text; f.className = 'feedback ' + feedback.cls; } }

/* ---------- rendering ---------- */
function bgFor(m) {
  const t = Math.pow(Math.min(1, m / MAX_DEPTH), 0.7);
  const a = [11, 69, 96], b = [1, 5, 12];
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgb(${c.join(',')})`;
}
function ladderHTML() {
  return `<div class="ladder">${TIERS.map((t, i) => `<div class="rung" style="--c:var(--t${i})"><i></i><span>${t.n}</span><span>${t.pts} pts</span><span>${depth(t.pts)} m</span></div>`).join('')}</div>`;
}
function seatList(showStatus) {
  const out = [];
  for (let i = 0; i < 3; i++) {
    const s = G.seats[i];
    if (!s) { out.push(`<div class="seat empty" style="--c:var(--faint)"><span class="nm">Waiting for a diver…</span></div>`); continue; }
    const you = (mode === 'host' && i === 0) || (mode === 'client' && s.id === myPeer);
    const st = showStatus ? (G.ans[s.id] ? 'locked in' : 'thinking') : (you ? 'you' : 'ready');
    out.push(`<div class="seat" style="--c:${COLORS[i]}"><span class="nm">${esc(s.name)}</span><span class="st">${st}</span></div>`);
  }
  return `<div class="seats">${out.join('')}</div>`;
}
function timerHTML() {
  const pct = (G.left / SECS) * 100;
  return `<div class="timer ${G.left <= 5 ? 'low' : ''}" id="timer"><div class="track"><b style="width:${pct}%"></b></div><span class="secs">${G.left}s</span></div>`;
}
function screenKey() {
  if (mode === 'home') return 'home:' + roomReady;
  if (mode === 'client' && (hostGone || !G)) return 'client:wait:' + hostGone;
  const seat = mySeatIndex();
  return [mode, G.phase, G.qi, G.seats.map(s => s.id + s.name).join(','), local.turn, local.step, myLocked ? 1 : 0, seat].join('|');
}
function draw(force) {
  const key = screenKey();
  if (!force && key === lastScreen) { refreshLive(); drawGauges(); return; }
  lastScreen = key;
  $main.innerHTML = screen();
  wire();
  drawGauges();
  const a = document.getElementById('ans'); if (a) a.focus();
  setFeedback();
}
function refreshLive() {
  const t = document.getElementById('timer');
  if (t && G) t.outerHTML = timerHTML();
  const s = document.getElementById('seatstat');
  if (s && G) s.innerHTML = seatList(G.phase === 'q');
  const w = document.getElementById('lobbyseats');
  if (w && G) w.innerHTML = seatList(false);
  const st = document.getElementById('startbtn');
  if (st && G) st.disabled = G.seats.length < 2;
}
function screen() {
  $meta.innerHTML = '';
  if (mode === 'home') return homeScreen();
  if (mode === 'client' && hostGone) return `<h2>Lost the host</h2><p class="lede">${hostSeen ? 'The host left, so this dive is over.' : `No game is running under code <b>${esc(code)}</b>. Check the code with your host.`}</p><div class="row"><button id="home">Back to the dock</button></div>`;
  if (mode === 'client' && !G) return `<h2>Finding game ${esc(code)}…</h2><p class="lede">Hold on while we ping the host.</p>`;
  $meta.innerHTML = `${code ? `<span>Code <b>${esc(code)}</b></span>` : '<span>One device</span>'}${G.phase !== 'lobby' ? `<span>Prompt <b>${Math.min(G.qi + 1, ROUNDS)}</b> / ${ROUNDS}</span>` : ''}`;
  if (G.phase === 'lobby') return lobbyScreen();
  if (G.phase === 'q') return questionScreen();
  if (G.phase === 'reveal') return revealScreen();
  return finalScreen();
}
function homeScreen() {
  const online = roomReady === 'yes';
  const nameField = `<div class="field"><label for="nm">Your name</label><input id="nm" maxlength="14" value="${esc(myName)}" placeholder="Diver" autocomplete="off"></div>`;
  return `
    <h1>Dive for the answer nobody else knows.</h1>
    <p class="lede">Every prompt has hundreds of right answers. The obvious ones keep you at the surface. The <b>rarer</b> your answer, the more points you score and the deeper you sink. Seven prompts, 25 seconds each, three divers. Deepest dive wins.</p>
    <div class="modes">
      <div class="mode">
        <h3>Play online</h3>
        ${nameField}
        <div class="row"><button id="host" ${online ? '' : 'disabled'}>Host a game</button></div>
        <div class="row"><input id="jc" class="code" maxlength="4" placeholder="CODE" autocomplete="off" ${online ? '' : 'disabled'}><button id="join" class="ghost" ${online ? '' : 'disabled'}>Join</button></div>
        <p class="note">${roomReady === 'wait' ? 'Connecting…' : online ? 'Each friend opens this page on their own device and joins with your code.' : 'Online play could not load. Check your internet connection. Pass and play still works.'}</p>
      </div>
      <div class="mode">
        <h3>Pass and play</h3>
        ${[0, 1, 2].map(i => `<div class="field"><label for="ln${i}">Diver ${i + 1}</label><input id="ln${i}" maxlength="14" placeholder="Diver ${i + 1}" autocomplete="off" style="border-left:4px solid ${COLORS[i]}"></div>`).join('')}
        <div class="row"><button id="local" class="ghost">Start on this device</button></div>
      </div>
    </div>
    <div class="stack"><h3>The depth chart</h3>${ladderHTML()}<p class="note">Each point takes you ${M_PER_PT} m deeper. If two divers give the same answer, they each get half. Every prompt hides exactly one Hadal answer.</p></div>`;
}
function lobbyScreen() {
  if (mode === 'host') return `
    <h3>Your game code</h3>
    <div class="bigcode">${esc(code)}</div>
    <p class="lede">Send your friends the link to this page and this code. Keep this tab open: your browser runs the game. They open the page, pick <b>Join</b>, and enter it.</p>
    <div id="lobbyseats">${seatList(false)}</div>
    <div class="row"><button id="startbtn" ${G.seats.length < 2 ? 'disabled' : ''}>Start the dive</button><button id="home" class="ghost">Leave</button><span class="note">Needs at least 2 divers. 3 is the full 1v1v1.</span></div>`;
  const seated = mySeatIndex() >= 0;
  return `<h2>${seated ? 'You’re in. Waiting for the host to start.' : G.seats.length >= 3 ? 'This game is full.' : 'Taking a seat…'}</h2>
    <div id="lobbyseats">${seatList(false)}</div>
    <div class="row"><button id="home" class="ghost">Leave</button></div>`;
}
function questionScreen() {
  const q = BANK[G.order[G.qi]];
  if (mode === 'local' && local.step === 'pass') {
    const s = G.seats[local.turn];
    return `<h3>Prompt ${G.qi + 1} of ${ROUNDS}</h3>
      <h2>Pass the device to <span style="color:${COLORS[local.turn]}">${esc(s.name)}</span></h2>
      <p class="lede">Everyone else, look away. The prompt appears when ${esc(s.name)} is ready.</p>
      <div class="row"><button id="ready">I’m ${esc(s.name)}, show the prompt</button></div>`;
  }
  const seat = mySeatIndex();
  const spectator = seat < 0;
  const mine = mode === 'local' ? G.ans[G.seats[local.turn].id] : (mode === 'host' ? G.ans.host : myLocked);
  const body = spectator
    ? `<p class="lede">You’re watching this one.</p>`
    : mine
      ? `<div class="locked" style="--c:var(--t${mine.r})"><span class="tag">Locked in</span><span class="ans">${esc(mine.t)}</span><span><span class="chip" style="--c:var(--t${mine.r})">${TIERS[mine.r].n}</span></span><span class="note">Your score shows after everyone answers.${mode !== 'local' ? ' Points are halved if someone gave the same answer.' : ''}</span></div>`
      : `<div class="answerbar"><input id="ans" maxlength="60" placeholder="Your rarest answer" autocomplete="off" spellcheck="false" aria-label="Your answer"><button id="go">Dive</button></div><div class="feedback" id="fb"></div>`;
  return `<h3>Prompt ${G.qi + 1} of ${ROUNDS}${mode === 'local' ? ` · ${esc(G.seats[local.turn].name)}` : ''}</h3>
    <p class="prompt">${esc(q.p)}</p>
    ${timerHTML()}
    ${body}
    ${mode !== 'local' ? `<div id="seatstat">${seatList(true)}</div>` : ''}`;
}
function revealScreen() {
  const qid = G.order[G.qi], q = BANK[qid];
  const rows = G.seats.map((s, i) => {
    const a = G.ans[s.id];
    return `<div class="res" style="--c:${COLORS[i]}">
      <span class="who">${esc(s.name)}</span>
      ${a ? `<span class="what">${esc(a.t)} <span class="chip" style="--c:var(--t${a.r})">${TIERS[a.r].n}</span>${a.sh ? ' <span class="chip" style="--c:var(--dim)">shared ½</span>' : ''}</span>` : `<span class="what none">No answer. Stayed at the surface.</span>`}
      <span class="pts">+${G.last[i] || 0}<small>${depth(G.last[i] || 0)} m</small></span></div>`;
  }).join('');
  const deep = [];
  const pick = (tier, n) => {
    const seen = new Set(), pool = [];
    for (const v of INDEX[qid].values()) if (v.tier === tier && !seen.has(v.key)) { seen.add(v.key); pool.push(v.disp); }
    for (let i = 0; i < n && pool.length; i++) deep.push([tier, pool.splice(Math.floor(Math.random() * pool.length), 1)[0]]);
  };
  pick(5, 1); pick(4, 3); pick(3, 2);
  const canNext = mode !== 'client';
  const last = G.qi >= ROUNDS - 1;
  return `<h3>Prompt ${G.qi + 1} of ${ROUNDS} · results</h3>
    <p class="prompt">${esc(q.p)}</p>
    <div class="results">${rows}</div>
    <div class="stack"><h3>Deeper water you could have reached</h3><div class="deeper">${deep.map(([t, d]) => `<span class="chip" style="--c:var(--t${t})">${esc(d)} · ${TIERS[t].pts}</span>`).join('')}</div></div>
    <div class="row">${canNext ? `<button id="next">${last ? 'See final depths' : 'Next prompt'}</button>` : `<span class="note">Waiting for the host to send the next prompt…</span>`}</div>`;
}
function finalScreen() {
  const ranked = G.seats.map((s, i) => ({ s, i, pts: G.tot[i] })).sort((a, b) => b.pts - a.pts);
  const top = ranked[0], tie = ranked.filter(r => r.pts === top.pts).length > 1;
  const zone = m => m >= 2000 ? 'the hadal trench' : m >= 1000 ? 'the midnight zone' : m >= 200 ? 'the twilight zone' : 'the sunlit shallows';
  return `<h3>Dive complete</h3>
    <h2>${tie ? 'A tie at the bottom.' : `<span style="color:${COLORS[top.i]}">${esc(top.s.name)}</span> dived deepest.`}</h2>
    <p class="lede">${tie ? `${ranked.filter(r => r.pts === top.pts).map(r => esc(r.s.name)).join(' and ')} both reached ${depth(top.pts)} m.` : `${depth(top.pts)} m down, into ${zone(depth(top.pts))}.`}</p>
    <div class="podium">${ranked.map((r, k) => `<div class="res" style="--c:${COLORS[r.i]}"><span class="who">${k + 1}${['st', 'nd', 'rd'][k]} · ${esc(r.s.name)}</span><span class="what">${depth(r.pts)} m</span><span class="pts">${r.pts}<small>points</small></span></div>`).join('')}</div>
    <div class="row">${mode === 'host' ? '<button id="again">New dive, same crew</button>' : mode === 'local' ? '<button id="againl">Play again</button>' : '<span class="note">The host can start a new dive.</span>'}<button id="home" class="ghost">Back to the dock</button></div>`;
}
function drawGauges() {
  const seats = G && mode !== 'home' ? G.seats : [{ name: 'Diver 1' }, { name: 'Diver 2' }, { name: 'Diver 3' }];
  const tot = G && mode !== 'home' ? G.tot : [0, 0, 0];
  const marks = [0, 200, 1000, 2000, MAX_DEPTH];
  const y = m => (Math.min(m, MAX_DEPTH) / MAX_DEPTH) * 100;
  const cols = [0, 1, 2].map(i => {
    const s = seats[i], m = depth(tot[i] || 0);
    return `<div class="col" style="--c:${s ? COLORS[i] : 'var(--faint)'}">${marks.slice(1, -1).map(mk => `<div class="zone" style="top:${y(mk)}%"></div>`).join('')}${s ? `<div class="line" style="height:${y(m)}%"></div><div class="diver" style="top:calc(${Math.max(3, Math.min(97, y(m)))}%)"></div>` : ''}</div>`;
  }).join('');
  const names = [0, 1, 2].map(i => {
    const s = seats[i];
    return s ? `<div style="--c:${COLORS[i]}"><div class="n">${esc(s.name)}</div><div class="d">${depth(tot[i] || 0)} m</div><div class="s">${tot[i] || 0} pts</div></div>` : `<div><div class="n" style="--c:var(--dim)">empty</div></div>`;
  }).join('');
  $gauges.innerHTML = `<h3>Dive profile</h3>
    <div class="gwrap"><div class="scale">${marks.map(mk => `<span style="top:${y(mk)}%">${mk} m</span>`).join('')}</div>${cols}</div>
    <div class="gnames"><div></div>${names}</div>`;
  const me = mySeatIndex();
  const focus = mode === 'home' || !G ? 0 : me >= 0 && mode !== 'local' ? depth(G.tot[me]) : depth(Math.max(...G.tot));
  document.body.style.background = bgFor(focus);
}

/* ---------- events ---------- */
function on(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }
function wire() {
  on('host', hostGame);
  on('join', joinGame);
  on('local', startLocal);
  on('startbtn', hostStart);
  on('go', submit);
  on('ready', localBegin);
  on('next', () => mode === 'host' ? hostNext() : localNext());
  on('again', hostAgain);
  on('againl', () => { const names = G.seats.map(s => s.name); G = newGame(); G.seats = names.map((n, i) => ({ id: 'p' + i, name: n })); G.phase = 'q'; local = { turn: 0, step: 'pass' }; draw(true); });
  on('home', goHome);
  const a = document.getElementById('ans');
  if (a) a.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
  const jc = document.getElementById('jc');
  if (jc) jc.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); joinGame(); } };
}
function goHome() {
  clearInterval(tick);
  if (R) { R.leave().catch(() => {}); R = null; }
  mode = 'home'; G = null; code = ''; myLocked = null; hostGone = false; hostSeen = false;
  draw(true);
}
function saveName() { try { localStorage.setItem('tt-name', myName); } catch (_) {} }
function toast(msg) { feedback = { text: msg, cls: 'bad' }; let n = document.getElementById('toast'); if (!n) { n = document.createElement('p'); n.id = 'toast'; n.className = 'feedback bad'; $main.prepend(n); } n.textContent = msg; }

draw(true);
})();
</script>

</body>
</html>
